name: FreeCAD 1.1.4 native synthetic smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freecad-synthetic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-freecad:
    name: FreeCAD native wall / TechDraw / exports
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out reviewed public code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify repository contains no unreviewed private files
        run: python3 ci/privacy_guard.py
      - name: Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install GUI and verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            xvfb xauth libegl1 libgl1 libglu1-mesa libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 \
            libsm6 libice6 libxrender1 libfontconfig1 fonts-dejavu-core
          python -m pip install 'PyMuPDF==1.26.7'
      - name: Verify updated skill subset and run regression tests
        run: |
          python ci/verify_vendor.py
          python ci/run_unit_tests.py
      - name: Download and SHA-256-verify FreeCAD official binary
        run: python ci/install_freecad.py
      - name: Build native synthetic wall and export A3
        run: python ci/run_native.py build
      - name: Independently validate CAD files and PDF geometry
        run: python ci/check_smoke.py build/smoke
      - name: Qualify updated skill native layer and void tools
        run: python ci/run_native.py native-tools
      - name: Reopen saved model in a separate FreeCAD process
        run: python ci/run_native.py cold-reopen
      - name: Change only a disposable model copy and reexport
        run: python ci/run_native.py mutate
      - name: Verify synthetic closed-release backup and restore
        run: python ci/snapshot_synthetic.py
      - name: Reopen restored model in a separate FreeCAD process
        run: python ci/run_native.py restore-reopen
      - name: Package reviewed public source snapshot
        run: git archive --format=zip --output=build/smoke/public-source.zip "$GITHUB_SHA"
      - name: Verify process isolation, unchanged source and PDF control spans
        run: python ci/check_extended.py build/smoke --expected-sha "$GITHUB_SHA"
      - name: Explain test scope
        if: success()
        run: |
          echo '### Synthetic FreeCAD and skill integration passed' >> "$GITHUB_STEP_SUMMARY"
          echo 'Native wall/window, layer/void modules, cold reopen, disposable mutation, backup/restore, PDF control spans.' >> "$GITHUB_STEP_SUMMARY"
          echo 'See qualification.json and unit-tests.json. The cloud subset is not the full host skill.' >> "$GITHUB_STEP_SUMMARY"
          echo '**Not qualified:** real R1, linked dimensions/sections, DXF, full SPDS, private route or construction.' >> "$GITHUB_STEP_SUMMARY"
      - name: Save ONLY synthetic CAD evidence and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: freecad-synthetic-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/smoke/
          retention-days: 3
          if-no-files-found: warn
